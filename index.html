<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Releaf Final Sprint</title>
<meta name="description" content="Releaf iGEM 2026 calendar from 21 Sep to the 16 Nov finals: wiki freeze 21 Oct, video freeze 28 Oct.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#191d23; --muted:#687080; --line:#e3e6eb; --line-strong:#cfd4dc;
  --weekend:#f6f7f9; --post:#eceef2; --today:#2563eb; --freeze:#d62828; --bar-ink:#ffffff;
  --opto:#7b4ce0; --bio:#0c9483; --sw:#2c6bd9; --plant:#3a8f38; --bopep:#e06a00;
  --wiki:#3d4858; --video:#cf2f6a; --mock:#a67c00; --trip:#b3261e;
  --shadow:0 10px 40px rgba(20,24,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --panel:#181c22; --ink:#e8ebf0; --muted:#98a1ae; --line:#2a3039; --line-strong:#3a424e;
    --weekend:#15191e; --post:#1d2229; --today:#6ea0ff; --freeze:#ff5a52;
    --opto:#8b62ee; --bio:#149e8c; --sw:#3a78e4; --plant:#3f9a3c; --bopep:#e87a14;
    --wiki:#5b687b; --video:#d8467c; --mock:#b58a0a; --trip:#cf3a31; --shadow:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#181c22; --ink:#e8ebf0; --muted:#98a1ae; --line:#2a3039; --line-strong:#3a424e;
  --weekend:#15191e; --post:#1d2229; --today:#6ea0ff; --freeze:#ff5a52;
  --opto:#8b62ee; --bio:#149e8c; --sw:#3a78e4; --plant:#3f9a3c; --bopep:#e87a14;
  --wiki:#5b687b; --video:#d8467c; --mock:#b58a0a; --trip:#cf3a31; --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{padding:12px 16px 24px;max-width:1600px;margin:0 auto}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:8px}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.count{display:flex;flex-wrap:wrap;gap:6px}
.count span{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.count b{color:var(--ink);font-weight:600}
.count .hot b{color:var(--freeze)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;user-select:none}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip:hover{border-color:var(--line-strong)}
.legend .hint{color:var(--muted);font-size:11.5px;margin-left:6px}
.legend .est-key{display:inline-block;width:22px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px;background:var(--muted);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)}
.linkbtn{background:none;border:0;padding:3px 4px;color:var(--today);cursor:pointer;font-size:12px}

/* calendar */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dow div{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:5px 8px}
.week{position:relative;border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.cell{border-right:1px solid var(--line);cursor:pointer}
.cell:last-child{border-right:0}
.cell.we{background:var(--weekend)}
.cell.post{background:var(--post);background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(127,127,127,.07) 7px 8px)}
.cell.out{background:var(--bg);cursor:default}
.cell.freeze{box-shadow:inset -3px 0 0 var(--freeze)}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
.cell:hover:not(.out){background-color:color-mix(in srgb,var(--today) 5%,transparent)}
.head{position:relative;display:grid;grid-template-columns:repeat(7,1fr);height:22px;pointer-events:none}
.dh{display:flex;align-items:center;gap:4px;padding:0 5px 0 7px;min-width:0}
.num{font-size:11.5px;font-weight:600;color:var(--muted);flex:none}
.num .mo{font-weight:700;color:var(--ink);margin-right:3px}
.dh.is-today .num{color:#fff;background:var(--today);border-radius:4px;padding:0 4px}
.dh.is-today .num .mo{color:#fff}
.flags{display:flex;gap:3px;min-width:0;margin-left:auto}
.flag{pointer-events:auto;cursor:pointer;font-size:10px;font-weight:600;line-height:15px;padding:0 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border:0}
.flag.minor{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.flag.major{background:var(--ink);color:var(--panel)}
.flag.freeze{background:var(--freeze);color:#fff}
.flag.mock{background:transparent;color:var(--mock);box-shadow:inset 0 0 0 1px var(--mock)}
.bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:var(--rh,20px);row-gap:2px;padding-bottom:6px;pointer-events:none}
.bar{pointer-events:auto;margin:0 4px;border-radius:4px;background:var(--c);color:var(--bar-ink);font-size:var(--fs,11.5px);font-weight:500;line-height:var(--rh,20px);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;transition:opacity .12s,filter .12s}
.bar.est{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.bar.must::after{content:"MUST";font-size:9px;font-weight:700;letter-spacing:.05em;margin-left:6px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.22)}
.bar:focus-visible,.flag:focus-visible,.chip:focus-visible{outline:2px solid var(--today);outline-offset:1px}
.cal.dim .bar:not(.hl){opacity:.28}
.bar.hl{filter:brightness(1.08)}

.section-name{font-size:12px;font-weight:600;color:var(--muted);margin:18px 2px 6px;letter-spacing:.02em}

/* drawer */
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:340px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;overflow:auto;transform:translateX(calc(100% + 24px));transition:transform .2s ease;z-index:10}
.drawer.open{transform:none}
.drawer .x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px}
.drawer .x:hover{background:var(--bg)}
.d-lane{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.d-lane i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.drawer h2{font-size:16px;margin:6px 28px 4px 0;line-height:1.3}
.d-when{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.drawer ul{margin:0 0 12px;padding-left:18px}
.drawer li{margin:3px 0}
.d-tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:2px 6px;margin:0 4px 8px 0}
.d-tag.est{background:color-mix(in srgb,var(--bopep) 16%,transparent);color:var(--ink)}
.d-tag.must{background:color-mix(in srgb,var(--freeze) 16%,transparent);color:var(--ink)}
.d-row{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.d-row:hover{background:var(--bg)}
.d-row i{flex:none;width:9px;height:9px;border-radius:2px;background:var(--c);margin-top:4px}
.d-row small{display:block;color:var(--muted)}
.d-sec{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}

@media (max-width:720px){
  .app{padding:10px 8px 24px}
  .dh{padding:0 3px}
  .flag{font-size:9px;padding:0 3px}
  .bar{margin:0 2px;padding:0 4px}
  .legend .hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>Releaf final sprint</h1>
      <div class="sub">21 Sep – 16 Nov 2026 · wiki freeze Wed 21 Oct · video freeze Wed 28 Oct · finals in Paris Mon 16 Nov</div>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="cal" id="sprint"></div>
  <div class="section-name">After the wiki freeze</div>
  <div class="cal" id="after"></div>
</div>
<aside class="drawer" id="drawer" aria-live="polite"><button class="x" id="dx" aria-label="Close">×</button><div id="dbody"></div></aside>

<script>
const Y = 2026;
const D = s => { const [m, d] = s.split('-').map(Number); return new Date(Y, m - 1, d); };
const add = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const days = (a, b) => Math.round((b - a) / 864e5);
const same = (a, b) => days(a, b) === 0;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt = d => `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;

const START = D('09-21'), FREEZE = D('10-21'), END = D('11-16');

const LANES = [
  { id: 'opto',  name: 'Optogenetics' },
  { id: 'bio',   name: 'Bioreactor' },
  { id: 'sw',    name: 'Software' },
  { id: 'plant', name: 'Plant assays' },
  { id: 'bopep', name: 'BoPep4 line' },
  { id: 'wiki',  name: 'Wiki' },
  { id: 'video', name: 'Video' },
  { id: 'mock',  name: 'Judging mocks' },
  { id: 'trip',  name: 'Finals' },
];
const laneOf = id => LANES.find(l => l.id === id);

const TASKS = [
  { id: 'o1', lane: 'opto', title: 'LPA-ACCD assay, repeat', s: '09-23', e: '09-27',
    notes: ['Set up Wed 23 Sep', 'Western blot results Sun 27 Sep'] },
  { id: 'b1', lane: 'bio', title: 'ACCD constitutive run 2 · students solo', s: '09-23', e: '09-27',
    who: 'Joshua, Anton, Noah',
    notes: ['Students set up and run it on their own from Wed 23 Sep', 'Western blot results Sun 27 Sep', 'The digital twin trials run on this data'] },
  { id: 'b2', lane: 'bio', title: 'Automated run: pinch + luer valves', s: '10-01', e: '10-03',
    notes: ['Pinch valve and luer valve automation from Mr Ho, Joshua’s teacher', 'Run Thu 1 – Sat 3 Oct'] },
  { id: 's1', lane: 'sw', title: 'AIoT sensors: install, run, collect', s: '09-21', e: '09-27',
    notes: ['Install and run the sensors', 'Every data collection finished by Sun 27 Sep'] },
  { id: 's2', lane: 'sw', title: 'AIoT sensor write-up', s: '09-28', e: '10-01',
    notes: ['Sensor write-up finished by Thu 1 Oct'] },
  { id: 's3', lane: 'sw', title: 'Digital twin trials on run-2 data', s: '09-27', e: '09-30', dep: 'b1',
    notes: ['UI is about 80% built; it now needs real experiments', 'Trials use trained data from bioreactor run 2', 'Run Sun 27 – Wed 30 Sep'] },
  { id: 's4', lane: 'sw', title: 'Digital twin write-up', s: '10-01', e: '10-01',
    notes: ['Writing finished by Thu 1 Oct'] },
  { id: 'p1', lane: 'plant', title: 'ACCD + LEA plant assays', s: '09-21', e: '10-21', must: true,
    notes: ['ACCD on agar and ACCD on hydroponics started Sun 20 Sep (agar run 2; run 1 data is unusable)',
            'Clear, usable ACCD, LEA and BoPep4 plant data by Wed 21 Oct. Not optional.',
            'BoPep4 plant work is tracked on its own line'] },
  { id: 'bp1', lane: 'bopep', title: 'Level-1 cloning: close out', s: '09-21', e: '09-30', est: true,
    notes: ['Level 1 is close to working', 'End date is assumed; set the real one'] },
  { id: 'bp2', lane: 'bopep', title: 'Protein design write-up (dry lab)', s: '09-21', e: '10-01',
    notes: ['The heaviest dry-lab piece of the project', 'Goes into the wiki full draft on Thu 1 Oct'] },
  { id: 'bp3', lane: 'bopep', title: 'BoPep4 on plants', s: '10-01', e: '10-21', est: true, must: true,
    notes: ['New protectant from academic work, moved toward farmer use', 'Start assumed at 1 Oct, once cloning closes', 'Plant data due Wed 21 Oct'] },
  { id: 'w1', lane: 'wiki', title: 'Full draft: results, registry, modeling, measurement, hardware', s: '09-21', e: '10-01',
    notes: ['Every existing result written, fixed and pushed by Thu 1 Oct', 'Results, registry, modeling, measurement, hardware, all up to date'] },
  { id: 'w2', lane: 'wiki', title: 'Add new results, fix, polish', s: '10-02', e: '10-21',
    notes: ['Add results from later experiments as they land', 'Freeze Wed 21 Oct'] },
  { id: 'v1', lane: 'video', title: 'Presentation video v1 (existing data)', s: '10-02', e: '10-10', est: true,
    notes: ['First version delivered Sat 10 Oct, built from existing data', 'Start assumed right after the wiki draft'] },
  { id: 'v2', lane: 'video', title: 'Video revisions', s: '10-11', e: '10-28',
    notes: ['Freeze Wed 28 Oct'] },
  { id: 't1', lane: 'trip', title: 'Paris: finals week', s: '11-10', e: '11-16',
    notes: ['Fly to Paris Tue 10 Nov', 'Finalist presentation Mon 16 Nov'] },
];
// judging mocks: every Sat and Sun from 3 Oct, 1–2 h
for (let d = D('10-03'); d <= END; d = add(d, 1)) {
  if (d.getDay() === 6 || d.getDay() === 0) {
    const k = `${d.getMonth() + 1}-${d.getDate()}`;
    TASKS.push({ id: 'm' + k, lane: 'mock', badge: true, title: 'Judging mock session', s: k, e: k, notes: ['At least 1–2 hours', 'Every Saturday and Sunday from 3 Oct'] });
  }
}
TASKS.forEach(t => { t.S = D(t.s); t.E = D(t.e); });

const MILES = [
  { d: '09-27', label: 'WB ×2', lvl: 'minor', title: 'Western blot results', note: 'Optogenetics LPA-ACCD and bioreactor run 2' },
  { d: '10-01', label: 'Wiki draft', lvl: 'major', title: 'Wiki full draft', note: 'All existing data written, fixed and pushed' },
  { d: '10-10', label: 'Video v1', lvl: 'major', title: 'Presentation video v1', note: 'First version from existing data' },
  { d: '10-21', label: 'Wiki freeze', lvl: 'freeze', title: 'Wiki freeze', note: 'Plant data for ACCD, LEA and BoPep4 must be in' },
  { d: '10-28', label: 'Video freeze', lvl: 'freeze', title: 'Presentation video freeze', note: '' },
  { d: '11-10', label: 'Fly to Paris', lvl: 'major', title: 'Flight to Paris', note: '' },
  { d: '11-16', label: 'Finals', lvl: 'freeze', title: 'Finalist presentation', note: 'Paris' },
];
MILES.forEach(m => m.D = D(m.d));

const hidden = new Set();
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();

/* ---------- legend + countdown ---------- */
const legend = document.getElementById('legend');
LANES.forEach(l => {
  const b = document.createElement('button');
  b.className = 'chip'; b.style.setProperty('--c', `var(--${l.id})`);
  b.setAttribute('aria-pressed', 'true'); b.dataset.lane = l.id;
  b.innerHTML = `<i></i>${l.name}`;
  b.title = 'Click to hide or show · double-click to show only this';
  b.onclick = () => { hidden.has(l.id) ? hidden.delete(l.id) : hidden.add(l.id); render(); };
  b.ondblclick = () => { hidden.clear(); LANES.forEach(x => x.id !== l.id && hidden.add(x.id)); render(); };
  legend.appendChild(b);
});
legend.insertAdjacentHTML('beforeend', `<button class="linkbtn" id="all">Show all</button><span class="hint"><span class="est-key"></span>striped = date assumed · click any bar or day for detail</span>`);
document.getElementById('all').onclick = () => { hidden.clear(); render(); };

document.getElementById('count').innerHTML = MILES.filter(m => m.lvl !== 'minor' && m.D >= today).map(m => {
  const n = days(today, m.D);
  return `<span class="${m.lvl === 'freeze' ? 'hot' : ''}">${m.title.replace('Presentation video', 'Video').replace('Finalist presentation', 'Finals')} <b>${n === 0 ? 'today' : n + ' d'}</b></span>`;
}).join('');

/* ---------- calendar ---------- */
const sprintEl = document.getElementById('sprint'), afterEl = document.getElementById('after');
const cal = [sprintEl, afterEl];

function weekStarts(from, to) { const a = []; for (let d = from; d <= to; d = add(d, 7)) a.push(d); return a; }
const SPRINT_WEEKS = weekStarts(START, D('10-19'));   // 5 weeks, ends Sun 25 Oct
const AFTER_WEEKS  = weekStarts(D('10-26'), END);     // 26 Oct – 16 Nov

function buildWeek(ws) {
  const we = add(ws, 6);
  const segs = TASKS.filter(t => !t.badge && !hidden.has(t.lane) && t.S <= we && t.E >= ws).map(t => {
    const s = t.S < ws ? ws : t.S, e = t.E > we ? we : t.E;
    return { t, c: days(ws, s), n: days(s, e) + 1, cl: t.S < ws, cr: t.E > we };
  });
  // pack lane by lane so each theme keeps its vertical order
  let base = 0;
  LANES.forEach(l => {
    const rows = [];
    segs.filter(g => g.t.lane === l.id).sort((a, b) => a.c - b.c || b.n - a.n).forEach(g => {
      let r = rows.findIndex(occ => occ.slice(g.c, g.c + g.n).every(x => !x));
      if (r < 0) { rows.push(Array(7).fill(false)); r = rows.length - 1; }
      rows[r].fill(true, g.c, g.c + g.n); g.row = base + r;
    });
    base += rows.length;
  });
  return { ws, segs, rows: base };
}

function inRange(d) { return d >= START && d <= END; }

function renderWeek(w, isSprint) {
  const el = document.createElement('div'); el.className = 'week';
  let cells = '', head = '';
  for (let i = 0; i < 7; i++) {
    const d = add(w.ws, i), out = !inRange(d);
    const cls = ['cell'];
    if (out) cls.push('out');
    else {
      if (d.getDay() === 0 || d.getDay() === 6) cls.push('we');
      if (isSprint && d > FREEZE) cls.push('post');
      if (same(d, FREEZE)) cls.push('freeze');
      if (same(d, today)) cls.push('today');
    }
    cells += `<div class="${cls.join(' ')}" data-day="${out ? '' : +d}" title="${out ? '' : fmt(d)}"></div>`;
    if (out) { head += '<div class="dh"></div>'; continue; }
    const first = i === 0 || d.getDate() === 1;
    const flags = MILES.filter(m => same(m.D, d)).map(m => `<button class="flag ${m.lvl}" data-mile="${m.d}" title="${m.title}">${m.label}</button>`)
      .concat(hidden.has('mock') ? [] : TASKS.filter(t => t.badge && same(t.S, d)).map(t => `<button class="flag mock" data-task="${t.id}" title="Judging mock, 1–2 h">Mock</button>`));
    head += `<div class="dh${same(d, today) ? ' is-today' : ''}"><span class="num">${first ? `<span class="mo">${MON[d.getMonth()]}</span>` : ''}${d.getDate()}</span><span class="flags">${flags.join('')}</span></div>`;
  }
  const bars = w.segs.map(g => {
    const t = g.t, cls = ['bar'];
    if (t.est) cls.push('est'); if (t.must && !g.cr) cls.push('must');
    if (g.cl) cls.push('cl'); if (g.cr) cls.push('cr');
    return `<button class="${cls.join(' ')}" data-task="${t.id}" style="--c:var(--${t.lane});grid-column:${g.c + 1}/span ${g.n};grid-row:${g.row + 1}" title="${t.title} · ${fmt(t.S)}${t.s !== t.e ? ' → ' + fmt(t.E) : ''}">${t.title}</button>`;
  }).join('');
  el.innerHTML = `<div class="cells">${cells}</div><div class="head">${head}</div><div class="bars">${bars}</div>`;
  return el;
}

function renderCal(host, starts, isSprint) {
  host.innerHTML = '<div class="dow">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => `<div>${x}</div>`).join('') + '</div>';
  const weeks = starts.map(buildWeek);
  weeks.forEach(w => { const el = renderWeek(w, isSprint); el._rows = w.rows; host.appendChild(el); });
  return weeks;
}

function render() {
  legend.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(!hidden.has(c.dataset.lane))));
  renderCal(sprintEl, SPRINT_WEEKS, true);
  renderCal(afterEl, AFTER_WEEKS, false);
  layout();
}

// Fit the five sprint weeks (21 Sep – 25 Oct) into one screen.
function layout() {
  const HEAD = 22, PAD = 6, GAP = 2;
  const weeks = [...sprintEl.querySelectorAll('.week')];
  const rows = weeks.reduce((a, w) => a + Math.max(w._rows, 1), 0);
  const phone = innerWidth < 720;
  const top = sprintEl.getBoundingClientRect().top + scrollY + sprintEl.querySelector('.dow').offsetHeight;
  const avail = innerHeight - top - 14;
  let rh = phone ? 18 : Math.floor((avail - weeks.length * (HEAD + PAD)) / rows) - GAP;
  rh = Math.max(15, Math.min(24, rh));
  const fs = rh >= 19 ? '11.5px' : rh >= 16 ? '10.5px' : '10px';
  [sprintEl, afterEl].forEach(c => { c.style.setProperty('--rh', rh + 'px'); c.style.setProperty('--fs', fs); });
  const used = weeks.reduce((a, w) => a + HEAD + PAD + w._rows * (rh + GAP), 0);
  const extra = phone ? 8 : Math.max(0, (avail - used) / weeks.length);
  weeks.forEach(w => w.style.minHeight = (HEAD + PAD + w._rows * (rh + GAP) + extra) + 'px');
  afterEl.querySelectorAll('.week').forEach(w => w.style.minHeight = (HEAD + PAD + Math.max(w._rows, 1) * (rh + GAP) + 14) + 'px');
}
addEventListener('resize', layout);

/* ---------- interaction ---------- */
const drawer = document.getElementById('drawer'), dbody = document.getElementById('dbody');
const close = () => drawer.classList.remove('open');
document.getElementById('dx').onclick = close;
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

function span(t) { return t.s === t.e ? fmt(t.S) : `${fmt(t.S)} → ${fmt(t.E)} · ${days(t.S, t.E) + 1} days`; }

function showTask(id) {
  const t = TASKS.find(x => x.id === id), l = laneOf(t.lane);
  const dep = t.dep ? TASKS.find(x => x.id === t.dep) : null;
  dbody.innerHTML = `
    <div class="d-lane" style="--c:var(--${t.lane})"><i></i>${l.name}</div>
    <h2>${t.title}</h2>
    <div class="d-when">${span(t)}</div>
    ${t.must ? '<span class="d-tag must">Must deliver</span>' : ''}${t.est ? '<span class="d-tag est">Dates partly assumed</span>' : ''}
    ${t.who ? `<div class="d-sec">Who</div><div style="margin-bottom:10px">${t.who}</div>` : ''}
    <div class="d-sec">Notes</div><ul>${t.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    ${dep ? `<div class="d-sec">Depends on</div><button class="d-row" data-task="${dep.id}" style="--c:var(--${dep.lane})"><i></i><span>${dep.title}<small>${span(dep)}</small></span></button>` : ''}`;
  drawer.classList.add('open');
}

function showDay(d) {
  const ms = MILES.filter(m => same(m.D, d));
  const ts = TASKS.filter(t => !hidden.has(t.lane) && t.S <= d && t.E >= d);
  const left = days(d, FREEZE);
  dbody.innerHTML = `
    <div class="d-lane">${d > FREEZE ? 'After wiki freeze' : left === 0 ? 'Wiki freeze day' : left + ' days to wiki freeze'}</div>
    <h2>${fmt(d)}</h2>
    ${ms.length ? '<div class="d-sec">Deadlines</div>' + ms.map(m => `<div class="d-row" style="--c:var(--freeze);cursor:default"><i></i><span><b>${m.title}</b>${m.note ? `<small>${m.note}</small>` : ''}</span></div>`).join('') : ''}
    <div class="d-sec">Running this day</div>
    ${ts.length ? ts.map(t => `<button class="d-row" data-task="${t.id}" style="--c:var(--${t.lane})"><i></i><span>${t.title}<small>${laneOf(t.lane).name} · ${span(t)}</small></span></button>`).join('') : '<div class="d-row" style="cursor:default;color:var(--muted)">Nothing scheduled</div>'}`;
  drawer.classList.add('open');
}

document.addEventListener('click', e => {
  const tk = e.target.closest('[data-task]'); if (tk) { showTask(tk.dataset.task); return; }
  const mi = e.target.closest('[data-mile]'); if (mi) { showDay(D(mi.dataset.mile)); return; }
  const c = e.target.closest('.cell[data-day]'); if (c && c.dataset.day) { showDay(new Date(+c.dataset.day)); return; }
  if (!e.target.closest('.drawer') && !e.target.closest('.legend')) close();
});
cal.forEach(c => {
  c.addEventListener('mouseover', e => {
    const b = e.target.closest('.bar'); if (!b) return;
    cal.forEach(x => x.classList.add('dim'));
    document.querySelectorAll(`.bar[data-task="${b.dataset.task}"]`).forEach(x => x.classList.add('hl'));
  });
  c.addEventListener('mouseout', e => {
    if (!e.target.closest('.bar')) return;
    cal.forEach(x => x.classList.remove('dim'));
    document.querySelectorAll('.bar.hl').forEach(x => x.classList.remove('hl'));
  });
});

render();
document.fonts && document.fonts.ready.then(layout);
</script>
</body>
</html>
